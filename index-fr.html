<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brussels Munch</title><link rel="stylesheet" href="style.css"></head><body><header class="wrap nav"><a class="brand" href="index.html">BRUSSELS<span>~</span>MUNCH</a><div class="nav-right"><a class="terms" id="terms" href="terms.html"></a><nav class="langs"><a href="index.html" class="">EN</a><a href="index-nl.html" class="">NL</a><a href="index-fr.html" class="active">FR</a></nav></div></header><main class="wrap"><section class="hero"><div><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p id="intro"></p><div class="hero-actions"><a class="btn btn-primary" href="#contact" id="cta"></a><a class="btn btn-secondary" id="termsBtn" href="terms.html"></a></div></div><aside class="next"><div class="next-label" id="nextLabel"></div><div class="next-date" id="nextDate"></div><h2 id="nextTitle"></h2><p id="nextText"></p></aside></section><section class="section"><h2 id="aboutTitle"></h2><div class="grid" id="cards"></div></section><section class="section"><h2 id="calendarTitle"></h2><div class="calendar" id="dates"></div></section><section class="section contact" id="contact"><div><h2 id="contactTitle"></h2><p id="contactText"></p></div><form id="contactForm"><div><label id="nameLabel" for="name"></label><input id="name" name="name" required></div><div><label id="emailLabel" for="email"></label><input id="email" name="email" type="email" required></div><div><label id="messageLabel" for="message"></label><textarea id="message" name="message" required></textarea></div><button class="btn btn-primary" id="send" type="submit"></button><div class="form-note" id="status" role="status"></div></form></section></main><footer class="wrap"><span>Brussels~Munch</span><span id="footer"></span></footer><script src="content.js"></script><script>const c=siteContent['fr'];const set=(id,v)=>document.getElementById(id).textContent=v;['eyebrow','title','intro','cta','nextLabel','nextDate','nextTitle','nextText','aboutTitle','calendarTitle','contactTitle','contactText','footer'].forEach(k=>set(k,c[k]));set('terms',c.terms);set('termsBtn',c.terms);set('nameLabel',c.name);set('emailLabel',c.email);set('messageLabel',c.message);set('send',c.send);document.getElementById('cards').innerHTML=c.cards.map(x=>'<article class="card"><h3>'+x[0]+'</h3><p>'+x[1]+'</p></article>').join('');document.getElementById('dates').innerHTML=c.dates.map(x=>'<div class="date"><strong>'+x[0]+'</strong><span>'+x[1]+'</span></div>').join('');document.getElementById('contactForm').onsubmit=async e=>{e.preventDefault();const s=document.getElementById('status');if(!CONTACT_ENDPOINT){s.textContent='Contact service not configured yet.';return}s.textContent='Sending…';try{const r=await fetch(CONTACT_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});s.textContent=r.ok?'Sent. Thank you!':'Something went wrong.'}catch{s.textContent='Something went wrong.'}}</script></body></html>
